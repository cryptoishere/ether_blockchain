[package]
name = "ether_alloy"
version = "0.2.0"
edition = "2024"

[lib]
name = "ether_blockchain"
path = "src/lib.rs"

[dependencies]
alloy = { version = "2.5", default-features = false, features = ["reqwest", "provider-ws", "contract", "sol-types", "signer-mnemonic", "network", "rpc-types"] }
tokio = { version = "1.53", default-features = false, features = ["time"] }
futures = "0.3"
anyhow = "1"
log = "0.4"
url = "2.5"

rand  = { version = "0.10", features = ["std_rng", "thread_rng"] }
zeroize = "1.9.1"
